name: backend

on:
  push:
    branches: [server-dist, main]
  pull_request:
    branches: [server-dist, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -race -cover

      # Advisory, not a hard gate: the Go standard library gets new patch
      # releases fixing minor CVEs faster than any one PR can chase, so a
      # hard failure here would routinely block unrelated changes on stdlib
      # lag outside this repo's control. Still fails loudly in the log for a
      # human to act on (e.g. bump the `go` directive), just doesn't block CI.
      - name: govulncheck (advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
